<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Đăng ký tài khoản</title>
</head>
<body>
    <div class="card">
        <h2>Đăng ký</h2>
        
        <input type="text" placeholder="Họ và Tên">
        <input type="text" placeholder="Email hoặc Số điện thoại">
        
        <div class="otp-group">
            <input type="text" placeholder="Mã xác thực">
            <button class="btn-otp">Gửi mã</button>
        </div>
        
        <input type="password" placeholder="Mật khẩu">
        
        <a href="login.html" class="btn-main">Tạo tài khoản</a>

        <div class="divider">Hoặc đăng ký bằng</div>

      
        <div class="social-group">
    
    <a href="https://accounts.google.com" target="_blank" class="btn-social">
    <img src="app/google.png" alt="Google">
    <span>Google</span>
    </a>

    <a href="https://www.facebook.com" target="_blank" class="btn-social">
        <img src="app/facebook.png" alt="Facebook">
        <span>Facebook</span>
    </a>
    
    <a href="https://www.tiktok.com" target="_blank" class="btn-social">
        <img src="app/tiktok.png" alt="TikTok">
        <span>TikTok</span>
    </a>
        </div>

        <div class="link-switch">
            Đã có tài khoản? <a href="login.html">Đăng nhập</a>
        </div>
    </div>
</body>
</html>
