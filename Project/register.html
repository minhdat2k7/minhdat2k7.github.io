<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Đăng ký tài khoản</title>
</head>
<body>
    <div class="card">
        <h2>Đăng ký</h2>
        <p>Email hoặc Số điện thoại</p>
        <input type="text" placeholder="Nhập Email/SĐT">
        <div class="otp-group">
            <input type="text" placeholder="Nhập mã OTP">
            <button class="btn-otp">Gửi mã</button>
        </div>
        <input type="password" placeholder="Mật khẩu">
        <a href="login.html" class="btn-main">Đăng ký</a>
        <div class="link-switch">
            Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
        </div>
    </div>
</body>
</html>
